[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-greennas"
version = "0.1.0"
description = "SA-GreenNAS: Robust, Calibrated, and Device-Aware Model Selection for Resource-Constrained Industrial Vision Systems"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10", "psutil>=5.9"]

[project.scripts]
sa-greennas = "sa_greennas.cli:main"

[tool.setuptools.packages.find]
include = ["sa_greennas*"]
